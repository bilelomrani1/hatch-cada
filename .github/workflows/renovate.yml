name: Renovate

on:
  schedule:
    - cron: "0 4 * * 1,2" # Monday & Tuesday 4am UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run in dry-run mode (no PRs created)"
        required: false
        default: false
        type: boolean
      log-level:
        description: "Log level (info or debug)"
        required: false
        default: "info"
        type: choice
        options:
          - info
          - debug
      force:
        description: "Force run (ignore schedule)"
        required: false
        default: false
        type: boolean

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.20
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: optional
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || 'null' }}
          RENOVATE_FORCE: ${{ inputs.force && '{"schedule":null}' || 'null' }}
          RENOVATE_REPOSITORY_CACHE: enabled
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
